[project]
name = "jazz-inador"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "librosa>=1.0.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pillow>=13.0.0",
    "scikit-learn>=1.9.1",
    "soundfile>=0.14.0",
]

# CUDA 13.0 build of PyTorch (GPU training for the CNN).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130" }]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
# Optional: only needed to train the CNN on an NVIDIA GPU (uv sync --group gpu).
gpu = [
    "torch>=2.14.1",
]
